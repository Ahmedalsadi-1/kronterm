          - generic [ref=f1e64]: 01—A
        - blockquote [ref=f1e65]: The workspace should preserve the shape of the problem, not force every problem into a row of tabs.
      - generic [ref=f1e66]:
        - complementary [ref=f1e67]:
          - paragraph [ref=f1e68]: Why it exists
          - heading "Workspace canvas is a complete product surface." [level=2] [ref=f1e69]
        - generic [ref=f1e70]:
          - paragraph [ref=f1e71]: Most technical work is spatial. A terminal explains what is running, a browser shows what the customer sees, an editor exposes the change, and an agent follows the evidence between them. Conventional desktops scatter that story across windows and ask the operator to rebuild it mentally.
          - paragraph [ref=f1e72]: KronTerm turns those surfaces into blocks on a persistent canvas. A project can have its own composition, with the terminal, preview, files, sandbox, and agent arranged around the work. The layout becomes part of the project memory and remains useful when the team returns tomorrow.
      - generic [ref=f1e73]:
        - generic [ref=f1e74]:
          - paragraph [ref=f1e75]: The operating model
          - heading "What changes when this surface is part of the workspace." [level=2] [ref=f1e76]
        - generic [ref=f1e77]:
