            - heading "Compose the loop" [level=3] [ref=f1e80]
            - paragraph [ref=f1e81]: Arrange blocks around the workflow instead of adapting the workflow to a fixed application shell.
          - article [ref=f1e82]:
            - generic [ref=f1e83]: "02"
            - heading "Keep context visible" [level=3] [ref=f1e84]
            - paragraph [ref=f1e85]: Output, previews, files, and agent state remain present at the same time and in the same place.
          - article [ref=f1e86]:
            - generic [ref=f1e87]: "03"
            - heading "Return without reconstruction" [level=3] [ref=f1e88]
            - paragraph [ref=f1e89]: Persistent layouts retain the operational shape of a project between sessions.
