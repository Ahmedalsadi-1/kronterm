<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color scheme" content="light dark" />
    <title>Wave</title>
    <link rel="stylesheet" href="/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/brands.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/sharp-solid.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/sharp-regular.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/custom-icons.min.css" />
    <script type="module">
      if (window.api) {
        import("/frontend/wave.ts");
      } else {
        import("/frontend/acp-browser-preview.tsx").catch((err) => {
          const elem = document.getElementById("main");
          if (elem) {
            elem.innerHTML = `<pre style="padding:24px;color:#991b1b;background:#fff1f2;height:100vh;white-space:pre-wrap;font:13px ui-monospace,monospace">${err?.stack || err?.message || err}</pre>`;
          }
        });
      }
    </script>
  </head>
  <body class="init" data-colorscheme="dark">
    <div id="main" class="flex flex-col w-full h-full"></div>
  </body>
</html>
