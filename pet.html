<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws: wss:; img-src 'self' data: blob: file: http: https:; media-src 'self' data: blob: file: http: https:; font-src 'self' data:; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KronosCode Pet</title>
    <script type="module" src="/frontend/pet/pet.ts"></script>
  </head>
  <body>
    <main id="pet-root" class="context-idle lifecycle-idle mode-docked">
      <div id="drag-handle" class="drag-handle pet-drag" title="Drag to move">
        <span class="drag-handle-dots"></span>
      </div>

      <div id="pet-cursor" class="pet-cursor" hidden>
        <div id="pet-cursor-ring" class="pet-cursor-ring">
          <div class="pet-cursor-dot"></div>
          <div class="pet-cursor-flash"></div>
        </div>
        <span id="pet-cursor-label" class="pet-cursor-label"></span>
      </div>

      <div id="thought" class="thought" hidden></div>
      <div id="action" class="action" hidden></div>

      <div id="reasoning-feed" class="reasoning-feed no-drag" hidden>
        <div class="reasoning-feed-header">
          <span>Reasoning Log</span>
          <button id="reasoning-feed-close" class="reasoning-feed-close" type="button">&times;</button>
        </div>
        <div id="reasoning-feed-body" class="reasoning-feed-body"></div>
      </div>

      <button id="pet-menu-toggle" class="pet-menu-toggle no-drag" title="Pet settings" aria-label="Pet settings">
        &#9881;
      </button>

      <div class="sprite-shell pet-drag">
        <img id="pet-sprite" alt="" draggable="false" />
      </div>

      <div class="activity">
        <span id="context" class="context">IDLE</span>
        <span id="detail" class="detail">KronosCode ready</span>
      </div>

      <!-- Modern Settings Panel -->
      <section id="pet-menu" class="pet-menu no-drag" hidden>
        <div class="pet-menu-title">
          <span class="pet-menu-app-icon">K</span>
          <div class="pet-menu-title-text">
            <strong>KronosCode Pet</strong>
            <small>Desktop assistant controls</small>
          </div>
        </div>

        <div class="pet-menu-section">
          <div class="pet-menu-section-title">PET MODE</div>
          <div class="pet-menu-segmented-control" id="pet-mode-group">
            <button type="button" class="pet-menu-segment" data-mode="off">Off</button>
            <button type="button" class="pet-menu-segment" data-mode="status-only">Status</button>
            <button type="button" class="pet-menu-segment" data-mode="docked">Docked</button>
            <button type="button" class="pet-menu-segment" data-mode="expressive">Expressive</button>
          </div>
        </div>

        <div class="pet-menu-separator"></div>

        <div class="pet-menu-section">
          <div class="pet-menu-section-title">BEHAVIOR OPTIONS</div>

          <div class="pet-toggle-row" id="menu-toggle-glow" data-option="glow">
            <span class="pet-toggle-label">Activity glow</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>

          <div class="pet-toggle-row" id="menu-toggle-thoughts" data-option="thoughts">
            <span class="pet-toggle-label">Thought bubbles</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>

          <div class="pet-toggle-row" id="menu-toggle-actions" data-option="actions">
            <span class="pet-toggle-label">Action bubbles</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>

          <div class="pet-toggle-row" id="menu-toggle-roam" data-option="roam">
            <span class="pet-toggle-label">Dock near KronTerm</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>

          <div class="pet-toggle-row" id="menu-toggle-follow-cursor" data-option="followUserCursor">
            <span class="pet-toggle-label">Follow cursor</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>

          <div class="pet-toggle-row" id="menu-toggle-clickthrough" data-option="clickthrough">
            <span class="pet-toggle-label">Click-through mode</span>
            <label class="pet-switch">
              <input type="checkbox" disabled />
              <span class="pet-switch-slider"></span>
            </label>
          </div>
        </div>

        <div class="pet-menu-separator"></div>

        <!-- Action Panel -->
        <div class="pet-menu-actions-row">
          <button class="pet-menu-btn" id="reasoning-toggle" type="button">Reasoning Log</button>
          <button class="pet-menu-btn" id="chat-toggle" type="button">Mini Chat</button>
        </div>
      </section>

      <button
        id="capture-preview"
        class="capture-preview no-drag"
        type="button"
        aria-expanded="false"
        aria-label="Preview the KronTerm widget"
        hidden
      >
        <span class="capture-preview-grip" aria-hidden="true"></span>
        <span class="capture-preview-icon" aria-hidden="true">&#9635;</span>
        <span id="capture-preview-caption" class="capture-preview-caption">Preview</span>
        <img id="capture-preview-image" alt="Latest agent preview" />
      </button>

      <form id="pet-chat" class="pet-chat no-drag" hidden>
        <input
          id="pet-chat-input"
          aria-label="Message KronosCode"
          placeholder="> message kronoscode"
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>

      <div id="resize-handle" class="resize-handle no-drag" title="Resize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M12 0v12H0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
          <path d="M12 4v8H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
        </svg>
      </div>
    </main>
  </body>
</html>
