<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KronosCode Pet</title>
    <script type="module" src="/frontend/pet/pet.ts"></script>
  </head>
  <body>
    <main id="pet-root" class="context-idle lifecycle-idle mode-docked">
      <div id="drag-handle" class="drag-handle pet-drag" title="Drag to move">
        <span class="drag-handle-dots"></span>
      </div>

      <div id="pet-cursor" class="pet-cursor" hidden>
        <div id="pet-cursor-ring" class="pet-cursor-ring">
          <div class="pet-cursor-dot"></div>
          <div class="pet-cursor-flash"></div>
        </div>
        <span id="pet-cursor-label" class="pet-cursor-label"></span>
      </div>

      <div id="thought" class="thought" hidden></div>
      <div id="action" class="action" hidden></div>

      <div id="reasoning-feed" class="reasoning-feed no-drag" hidden>
        <div class="reasoning-feed-header">
          <span>Reasoning Log</span>
          <button id="reasoning-feed-close" class="reasoning-feed-close" type="button">&times;</button>
        </div>
        <div id="reasoning-feed-body" class="reasoning-feed-body"></div>
      </div>

      <button id="pet-menu-toggle" class="pet-menu-toggle no-drag" title="Pet settings" aria-label="Pet settings">
        &#9881;
      </button>

      <div class="sprite-shell pet-drag">
        <img id="pet-sprite" alt="" draggable="false" />
      </div>

      <div class="activity">
        <span id="context" class="context">IDLE</span>
        <span id="detail" class="detail">KronosCode ready</span>
      </div>

      <!-- macOS-style menu -->
      <section id="pet-menu" class="pet-menu no-drag" hidden>
        <div class="pet-menu-title">
          <span class="pet-menu-app-icon">K</span>
          <span><strong>KronosCode</strong><small>Computer use controls</small></span>
        </div>

        <!-- Mode group -->
        <div class="pet-menu-mode-group" id="pet-mode-group">
          <div class="pet-menu-mode-item mode-selected" data-mode="off">Off</div>
          <div class="pet-menu-mode-item" data-mode="status-only">Status only</div>
          <div class="pet-menu-mode-item" data-mode="docked">Docked</div>
          <div class="pet-menu-mode-item" data-mode="expressive">Expressive</div>
        </div>

        <div class="pet-menu-separator"></div>

        <!-- Toggle items -->
        <div class="pet-menu-item" id="menu-toggle-glow" data-option="glow">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Activity glow
          </span>
        </div>
        <div class="pet-menu-item" id="menu-toggle-thoughts" data-option="thoughts">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Thought bubbles
          </span>
        </div>
        <div class="pet-menu-item" id="menu-toggle-actions" data-option="actions">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Action bubbles
          </span>
        </div>
        <div class="pet-menu-item" id="menu-toggle-roam" data-option="roam">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Dock near Kronterm when idle
          </span>
        </div>
        <div class="pet-menu-item" id="menu-toggle-follow-cursor" data-option="followUserCursor">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Follow cursor during tool use
          </span>
          <span class="pet-menu-shortcut">⌘⇧F</span>
        </div>
        <div class="pet-menu-item" id="menu-toggle-clickthrough" data-option="clickthrough">
          <span class="pet-menu-label">
            <span class="pet-menu-check">✓</span>
            Click-through mode
          </span>
        </div>

        <div class="pet-menu-separator"></div>

        <!-- Action items -->
        <button class="pet-menu-action" id="reasoning-toggle" type="button">Reasoning Log</button>
        <button class="pet-menu-action" id="chat-toggle" type="button">Mini Chat</button>
      </section>

      <figure id="capture-preview" class="capture-preview no-drag" hidden>
        <figcaption>Computer use view</figcaption>
        <img id="capture-preview-image" alt="Latest agent screenshot" />
      </figure>

      <form id="pet-chat" class="pet-chat no-drag" hidden>
        <input id="pet-chat-input" aria-label="Message KronosCode" placeholder="> message kronoscode" autocomplete="off" />
        <button type="submit">Send</button>
      </form>

      <div id="resize-handle" class="resize-handle no-drag" title="Resize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M12 0v12H0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
          <path d="M12 4v8H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
        </svg>
      </div>
    </main>
  </body>
</html>
