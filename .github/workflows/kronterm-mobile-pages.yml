name: KronTerm Mobile PWA

on:
  workflow_dispatch:
  push:
    branches: [feat/kronterm-mobile-openchamber]
    paths:
      - 'mobile/kronterm-mobile/www/**'
      - '.github/workflows/kronterm-mobile-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload KronTerm Mobile PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/kronterm-mobile/www

      - name: Deploy KronTerm Mobile
        id: deployment
        uses: actions/deploy-pages@v4
